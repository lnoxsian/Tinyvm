{{ define "title" }}Settings - TinyVM{{ end }}

{{ define "content" }}
<div class="content-header">
    <h1 class="content-title">Application Settings</h1>
</div>

<div class="card" style="max-width: 600px;">
    <div style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.25rem;">Server Version</label>
            <span style="color: var(--text-muted);">{{ .Version }}</span>
        </div>
        <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.25rem;">Data Directory</label>
            <code style="color: var(--text-muted);">{{ .DataDir }}</code>
        </div>
        <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.25rem;">Listen Address</label>
            <code style="color: var(--text-muted);">{{ .ListenAddr }}</code>
        </div>
    </div>
</div>
{{ end }}
